<!DOCTYPE html>
<html>
    <head>
        <title>Task2</title>
    </head>
    <body>
        <button onclick="change()">Add Hello</button>
        <div id="result-name"></div>
        <script>
            var result=document.getElementById("result-name");
            function change() {
                var tag=document.createElement("h1");
                tag.textContent="Hello";
                result.append(tag)
            }
        </script>
    </body>
</html>
