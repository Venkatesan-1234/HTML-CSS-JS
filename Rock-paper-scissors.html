<!DOCTYPE html>
<html>
   <head>
      <title>Rock-paper-Scissors Project</title>
      <style>
         body {
            background-color: rgb(25,25,25);
            color:white;
            font-family:Arial;
         }
         .title {
            font-size:30px;
            font-weight:bold;
         }
         .move-icon {
             height:35px;
         }
         .move-button {
            background-color: transparent;
            border: 3px solid white;
            width:120px;
            height:120px;
            border-radius:60px;
            margin-right:10px;
            cursor:pointer;
         }
         .result {
            font-size:25px;
            font-weight:bold;
            margin-top:50px;
         }
         .score {
            margin-top:60px;
         }
         .reset {
            background-color: white;
            border: none;
            font-size: 15px;
            padding: 8px 15px;
            cursor:pointer;
         }
      </style>
   </head>
   <body>
      <p class="title">Rock Paper Scissors</p>
      <button onclick="
       pickcomputermove();
       playgame('rock');
       " class="move-button"><img src="images/rock-emoji.png" class="move-icon"></button> 

     <button onclick="
     pickcomputermove();
     playgame('paper');
     " class="move-button"><img src="images/paper-emoji.png" class="move-icon"></button>

     <button onclick="
       pickcomputermove();
       playgame('scissors');
     " class="move-button"><img src="images/scissors-emoji.png" class="move-icon"></button> 

     <p class="js-moves result"></p>
     <p class="js-result"></p>
     <p class="js-score score"></p>

     <button onclick=" 
     score.wins=0
     score.loses=0
     score.ties=0
     updatescore();
     " class="reset">Reset Score</button>

   
     <script>
      
      const score= {
         wins:0,
         ties:0,
         loses:0
      }
      updatescore();
      function updatescore() {
         document.querySelector('.js-score').innerHTML=`wins: ${score.wins}, loses:${score.loses}, ties:${score.ties}`;
      }
      let computermove='';
      function pickcomputermove(){
      const randomnumber=Math.random()  
       if (randomnumber>=0 && randomnumber<1/3) {
         computermove='rock'
       }
       else if (randomnumber>=1/3 && randomnumber<2/3) {
         computermove='paper'
       }
       else if (randomnumber>=2/3 && randomnumber<1) {
         computermove='scissors'
       }
      }

      let result='';
      function playgame(playermove) {
      if (playermove==='rock') {
         if (computermove === 'rock') {
            result='tie';
         }
         else if (computermove=== 'paper') {
            result='lose';
         }
         else if (computermove === 'scissors') {
            result = 'win';
         }
      }
      else if (playermove==='paper') {
         if (computermove === 'rock') {
         result='win';
      }
      else if (computermove=== 'paper') {
         result='tie';
      }
      else if (computermove === 'scissors') {
         result = 'lose';
      }
      }
      else if (playermove==='scissors') {
           if (computermove === 'rock') {
         result='lose';
      }
      else if (computermove=== 'paper') {
         result='win';
      }
      else if (computermove === 'scissors') {
         result = 'tie';
      }
      }
      if (result==='win') {
         score.wins+=1;
      }
      else if (result==='lose') {
         score.loses+=1;
      }
      else if (result==='tie') {
         score.ties+=1;
      }
      updatescore();
      document.querySelector('.js-moves').innerHTML=`You choose <img src="images/${playermove}-emoji.png" class="move-icon"> and Computer choose <img src="images/${computermove}-emoji.png" class="move-icon">`;
      document.querySelector('.js-result').innerHTML= `You ${result}`;
   }
     </script>
   </body>
</html>
